# The tests that need nothing but Python, on every push and pull request.
#
# Most of the suite drives real machines in emulators -- ZEsarUX, DOSBox-X --
# with the assemblers and the original adventures beside it, and none of that
# is in the repository: tools/ and snapshots/ are other people's.  Those tests
# see it is not there and skip themselves, and what runs here is the rest:
# the source format, the compiler and decompiler, the database, the renderer,
# the interpreter in Python, the viewer.  The whole suite runs on a machine
# that has the tools: see doc/pruebas.md.
name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        # the viewer opens no window: SDL's dummy driver draws nowhere
        env:
          SDL_VIDEODRIVER: dummy
        run: python -m pytest -q -n 4 --dist loadgroup -m "not serial"
