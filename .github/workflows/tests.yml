# The tests that need no emulator, on every push and pull request.
#
# Most of the suite drives real machines in emulators -- ZEsarUX, DOSBox-X --
# with the original adventures beside it, and none of that is in the
# repository: tools/ and snapshots/ are other people's.  Those tests see it is
# not there and skip themselves, and what runs here is the rest: the source
# format, the compiler and decompiler, the database, the renderer, the
# interpreter in Python, the viewer -- and, with the two assemblers, which are
# free and quick to have, regac make itself: the example built for the nine
# machines and the report of the memory it takes.  sjasmplus is built from its
# own repository at the version the release uses, and kept between runs.  The
# whole suite runs on a machine that has the tools: see doc/pruebas.md.
name: tests

on:
  push:
  pull_request:

env:
  SJASMPLUS: v1.23.1                    # as .github/workflows/release.yml

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
      - name: sjasmplus, as it was built last time
        id: sjasmplus
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sjasmplus/build/release
          key: sjasmplus-${{ env.SJASMPLUS }}-${{ runner.os }}
      - name: sjasmplus, built
        if: steps.sjasmplus.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SJASMPLUS" \
            https://github.com/z00m128/sjasmplus.git "$RUNNER_TEMP/sjasmplus"
          make -C "$RUNNER_TEMP/sjasmplus" USE_LUA=0 -j4
      - name: The assemblers, on the path
        run: |
          echo "$RUNNER_TEMP/sjasmplus/build/release" >> "$GITHUB_PATH"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        # the viewer opens no window: SDL's dummy driver draws nowhere
        env:
          SDL_VIDEODRIVER: dummy
        run: python -m pytest -q -n 4 --dist loadgroup -m "not serial"
      - name: Test, the ones that run on their own
        # what measures time, and what cannot share the machine; they all want
        # an emulator and skip themselves here, but one that did not would
        # still be run.
        # One expression and not two -m, and not the mirror: see
        # doc/pruebas.md.
        env:
          SDL_VIDEODRIVER: dummy
        run: python -m pytest -q -m "serial and not mirror"
