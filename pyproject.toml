[project]
name = "regac"
version = "0.1.0"
description = "GAC interpreter"
authors = [
    {name = "Cronomantic",email = "cronomantic@gmail.com"}
]
readme = "README.md"
# pygame-ce needs 3.10, and 3.9 reached its end of life in 2025.
requires-python = ">=3.10"
dependencies = [
    # The community fork: it is import compatible with pygame and, unlike
    # pygame itself, publishes wheels for current Python versions.
    "pygame-ce (>=2.5.8,<3.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest (>=8.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
