[project]
name = "regac"
version = "0.2.0"
description = "GAC interpreter"
authors = [
    {name = "Cronomantic",email = "cronomantic@gmail.com"}
]
readme = "README.md"
# 3.11 is the first whose standard library reads TOML, which is what a
# project file is written in.
requires-python = ">=3.11"
dependencies = [
    # The community fork: it is import compatible with pygame and, unlike
    # pygame itself, publishes wheels for current Python versions.
    "pygame-ce (>=2.5.8,<3.0.0)",
]

# `regac` as a command, the same as `python -m regac`.  It is installed from
# the checkout itself (`poetry install`, or `pip install -e .`), because the
# interpreters it builds with are the folders beside it, z80/ and x86/.
[project.scripts]
regac = "regac.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest (>=8.0)",
    # Almost every test drives a real emulator, so the suite spends its time
    # waiting rather than computing and goes several at a time: see
    # doc/pruebas.md and tests/conftest.py.
    "pytest-xdist (>=3.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
